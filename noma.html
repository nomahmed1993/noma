<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables and lists</title>
</head>

<body>
    <ul type="square">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
    <ol type="A">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>
    <!-- table -->
    <table>
        <h3>HTML</h3>
        <thead>
            <tr>
                <th>Tag</th>
                <th>Description</th>
                <th>Example</th>
                <th>Attributes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td> Volunteer</td>
                <td> A JOLLY PErson</td>
                <td>google</td>
                <td> Philosophy</td>
            </tr>

    </table>
</body>

</html>
