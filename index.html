<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Google Form</h1>
    <p>Username:
    <input type="text" name="username"  size="15" maximumlength="30">
</p>
     <p>Password:
     <input type="password" name="password"  size="8" maximumlength="8">
     </p>
     <p>Forget password? <a href="https://www.google.com/accounts/recovery">Recover your password</a></p>
     <p>Email:
        <input type="email" name="email"  size="15" maximumlength="30">
        <p>
            forget email? <a href="https://www.google.com/accounts/recovery">Recover your Email</a>
        </p>
     <input type="submit" value="Submit"></p>
     <p>
        <label>
     <input type="checkbox" name="subscribe" checked="checked" /> 
     Sign me up for email updates
    </label>
    <p>Don't have an account? <a href="https://www.google.com/accounts/signup">Sign up</a></p>
    <p>By creating an account, you agree to Google's <a href="https://policies.google.com/terms">Terms of Service</a> and <a href="https://policies.google.com/privacy">Privacy Policy</a>.
        <p>
            <label>
                <input type="checkbox" name="agree" required /> 
                I agree to the Terms of Service and Privacy Policy
            </label>
            <form>
                <a href="form.html" target="_blank"> Sign In</a>
            </form>
            



    
            

     </p>     
</body>
</html>
